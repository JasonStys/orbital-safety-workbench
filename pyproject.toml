# Jason Stys: bounded educational orbital replay, numerical contracts, and tool policy.
[project]
name = "orbital-safety-workbench"
version = "1.0.0"
description = "Civilian archived orbit replay and synthetic close-approach evidence by Jason Stys"
requires-python = ">=3.12,<3.15"
dependencies = ["sgp4==2.27"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
[tool.coverage.run]
branch = true
source = ["orbital"]
[tool.coverage.report]
fail_under = 90
show_missing = true
[tool.mypy]
strict = true
python_version = "3.12"
files = ["orbital"]
[[tool.mypy.overrides]]
module = ["sgp4.*"]
ignore_missing_imports = true
