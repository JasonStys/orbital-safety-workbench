# Validation by Jason Stys. Jobs: Python/science, browser integration, portable native smoke.
# Variables: matrix OS/Python; no Actions artifacts/caches. Exact map: docs/FILE_CATALOG.md.
name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  science:
    name: Science / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m ruff check orbital tests tools launcher.py
      - run: python -m ruff format --check orbital tests tools launcher.py
      - run: python -m mypy orbital
      - run: python tools/verify_repo.py
      - run: python -m pytest --cov=orbital --cov-report=term-missing
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python -m pip_audit --disable-pip --no-deps -r requirements-dev.lock
  browser:
    name: Browser / Chromium + Firefox + WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", package-manager-cache: false }
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run audit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
  native:
    name: Portable app / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", package-manager-cache: false }
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
      - run: npm run build
      - run: python tools/package_app.py
