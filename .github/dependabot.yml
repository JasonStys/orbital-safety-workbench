# Reviewed dependency proposals by Jason Stys; no auto-merge or runtime-changing bypass.
# Variables: package ecosystems, directory and weekly cadence. See docs/RELEASE.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      codeql-actions:
        patterns: ["github/codeql-action/*"]
